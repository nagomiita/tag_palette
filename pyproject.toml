[project]
name = "tag-palette"
version = "0.1.0"
description = "WD14 Tagger を使った画像タグ生成ライブラリ (翻訳・カテゴリ分類・センシティブ判定付き)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "googletrans>=4.0.2",
    "numpy>=1.26.4",
    "pandas>=2.3.0",
    "pillow>=11.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tag_palette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
