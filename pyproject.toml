[project]
name = "tag-palette"
version = "0.1.0"
description = "WD14 Tagger を使った画像タグ生成ライブラリ (翻訳・カテゴリ分類・センシティブ判定付き)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dghs-imgutils>=0.19.0",
    "fugashi>=1.5.2",
    "googletrans>=4.0.2",
    "huggingface-hub>=0.28.1",
    "numpy>=1.26.4",
    "ollama>=0.6.1",
    "onnxruntime-gpu>=1.20.1",
    "openai>=2.26.0",
    "opencv-python-headless>=4.11.0",
    "pandas>=2.3.0",
    "pillow>=11.2.1",
    "pillow-heif>=1.3.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0.0",
    "torch>=2.6.0",
    "unidic-lite>=1.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tag_palette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# PyTorch CPU 版を使用 (sentence-transformers 用)
# タグ生成は onnxruntime-gpu が GPU を使用
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# bchlib は C コンパイラ必須 (CCIP には不要) なので除外
[tool.uv]
override-dependencies = ["bchlib ; sys_platform == 'never'"]
