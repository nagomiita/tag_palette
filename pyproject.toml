[project]
name = "tag-palette"
version = "0.1.0"
description = "WD14 Tagger を使った画像タグ生成ライブラリ (翻訳・カテゴリ分類・センシティブ判定付き)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "googletrans>=4.0.2",
    "huggingface-hub>=0.28.1",
    "numpy>=1.26.4",
    "onnxruntime-gpu>=1.20.1",
    "opencv-python-headless>=4.11.0",
    "pandas>=2.3.0",
    "pillow>=11.2.1",
    "sentence-transformers>=3.0.0",
    "torch>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tag_palette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
